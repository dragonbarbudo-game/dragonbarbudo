<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>El Caballero Errante — Demo Isométrica</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #1a1f2b; touch-action: none;
  }
  #game-root { position: relative; width: 100%; height: 100%; }
  #game-root canvas { display: block; }

  /* Joystick táctil (arrastre libre, cualquier ángulo): mismo criterio
     visual que el resto del portal (círculos semitransparentes), pero
     autocontenido — este juego no depende de ningún CSS del sitio
     principal. */
  #isoJoystick {
    position: fixed; left: 24px; bottom: 24px; z-index: 10;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(20, 22, 30, 0.4); border: 2px solid rgba(255,255,255,0.25);
    touch-action: none; cursor: pointer;
  }
  #isoJoystickThumb {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
    margin-left: -26px; margin-top: -26px; border-radius: 50%;
    background: rgba(217, 164, 65, 0.85); box-shadow: 0 4px 10px rgba(0,0,0,.35);
    pointer-events: none; transition: background .15s;
  }
</style>
</head>
<body>
<div id="game-root"></div>

<div id="isoJoystick" aria-label="Mover (arrastra en cualquier dirección)">
  <div id="isoJoystickThumb"></div>
</div>

<!-- Phaser 3 vía CDN (ver README.md: se eligió CDN, sin npm/bundler, para
     poder abrir este index.html suelto sin paso de compilación). -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="src/config.js"></script>
<script src="src/scenes/BootScene.js"></script>
<script src="src/scenes/GameScene.js"></script>
<script src="src/main.js"></script>
</body>
</html>
