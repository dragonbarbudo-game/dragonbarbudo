<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>El Caballero Errante — Demo Isométrica</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #1a1f2b; touch-action: none;
  }
  #game-root { position: relative; width: 100%; height: 100%; }
  #game-root canvas { display: block; }

  /* Cruceta táctil: mismo criterio visual que el resto del portal
     (botones circulares semitransparentes), pero autocontenida — este
     juego no depende de ningún CSS del sitio principal. */
  .iso-touch-controls {
    position: fixed; left: 16px; bottom: 16px; z-index: 10;
    width: 168px; height: 168px;
    display: grid; grid-template-columns: 54px 54px 54px; grid-template-rows: 54px 54px 54px;
    gap: 3px;
  }
  .iso-btn {
    width: 54px; height: 54px; border-radius: 50%; border: none;
    background: rgba(20, 22, 30, 0.55); color: #fff; font-size: 20px;
    cursor: pointer; user-select: none; touch-action: manipulation;
    box-shadow: 0 4px 10px rgba(0,0,0,.35);
  }
  .iso-btn:active { background: rgba(217, 164, 65, 0.85); }
  #isoBtnUp { grid-column: 2; grid-row: 1; }
  #isoBtnLeft { grid-column: 1; grid-row: 2; }
  #isoBtnRight { grid-column: 3; grid-row: 2; }
  #isoBtnDown { grid-column: 2; grid-row: 3; }
</style>
</head>
<body>
<div id="game-root"></div>

<div class="iso-touch-controls">
  <button type="button" class="iso-btn" id="isoBtnUp" aria-label="Arriba">▲</button>
  <button type="button" class="iso-btn" id="isoBtnLeft" aria-label="Izquierda">◀</button>
  <button type="button" class="iso-btn" id="isoBtnRight" aria-label="Derecha">▶</button>
  <button type="button" class="iso-btn" id="isoBtnDown" aria-label="Abajo">▼</button>
</div>

<!-- Phaser 3 vía CDN (ver README.md: se eligió CDN, sin npm/bundler, para
     poder abrir este index.html suelto sin paso de compilación). -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="src/config.js"></script>
<script src="src/scenes/BootScene.js"></script>
<script src="src/scenes/GameScene.js"></script>
<script src="src/main.js"></script>
</body>
</html>
